    <script type="text/javascript" src="ClientScript/jquery-blockUI.js"></script>
    <script type="text/javascript" src="ClientScript/jquery-blockUI-ext.js"></script>

    <script type="text/javascript">

        var sessionThreadIdField = 'SessionThreadIdField';
        function updateCurrentContentPage() {

            var sessionThreadID = window.name;
	    var sessionContext = {"SessionThreadIdField":null,"PassedContentPage":null,"IsProxyLogin":false};
	    sessionContext.SessionThreadIdField = sessionThreadID;
	  
            jQuery.ajax(
						{ url: 'SessionThreadContentPage.ashx',
						    type: 'GET',
						    timeout: 60000,
						    contentType: 'application/json',
						    dataType: 'json',
						    cache: false,
						    data: sessionContext
						}
					).done(function (response) {
                        
					    var mainFramesetRows = '85';

					    mainFramesetRows += !response.IsJournalLive ? ',25' : ',0';

					    mainFramesetRows += response.IsInProxyMode ? ',25' : ',0';

					    mainFramesetRows += ",*";

					    mainFramesetRows += (response.SessionExists && response.IsTzConfigured) ? ',20' : ',0';

					    mainFramesetRows += response.ShowDataProtectionInfoBar ? ',20' : ',0';

					    $('#mainFrameSet').attr('rows', mainFramesetRows);

					    var menuFrame = $('#menuPage');
					    if (menuFrame) {
					        var mainMenuUrl = response.UseTextBasedMenus ? 'Menu.aspx' : ((response.IsUserFullyLoggedIn || response.IsIdentityProviderRegistration) ? 'menu2.asp' : 'menu.asp');
					        menuFrame.attr('src', mainMenuUrl);

					    }

					    var identificationUrl = 'Identification.aspx';
					    var proxyFrameUrl = 'ProxyBanner.aspx';

					    if (sessionThreadID && !response.IsInProxyMode) {
					        var threadQueryString = '?' + sessionThreadIdField + '=' + sessionThreadID;
					        identificationUrl += threadQueryString;
					        proxyFrameUrl += threadQueryString;
					    }

					    var identFrame = $('#ident');
					    if (identFrame) {
					        identFrame.attr('src', identificationUrl);
					    }

					    var proxyFrame = $('#proxy');
					    if (proxyFrame) {
					        if (response.IsInProxyMode) {
					            proxyFrame.attr('src', proxyFrameUrl);
					            proxyFrame.css('display', 'block');
					        }
					        else {
					            proxyFrame.css('display', 'none');
					        }
					    }

					    var contentFrame = $('#content');
					    if (contentFrame) {
					        contentFrame.attr('src', response.CurrentContentPage);

					    }

					    var implMessageFrame = $('#implMessage');
					    if (implMessageFrame) {
					        if (!response.IsJournalLive) {
					            implMessageFrame.attr('src', 'implMessageBanner.asp');
					            implMessageFrame.css('display', 'block');
					        }
					        else {
					            implMessageFrame.css('display', 'none');
					        }
					    }

					    var timezoneFooterFrame = $('#tz');
					    if (timezoneFooterFrame) {
					        if (response.SessionExists && response.IsTzConfigured) {
					            timezoneFooterFrame.attr('src', 'TimeZonefooter.aspx');
					            timezoneFooterFrame.css('display', 'block');
					        }
					        else {
					            timezoneFooterFrame.css('display', 'none');
					        }
					    }

					    var dataProtectioBarFrame = $('#tc');
					    if (dataProtectioBarFrame) {
					        if (response.ShowDataProtectionInfoBar) {
					            dataProtectioBarFrame.attr('src', response.DataProtectionInfoBarName);
					            dataProtectioBarFrame.css('display', 'block');
					        }
					        else {
					            dataProtectioBarFrame.css('display', 'none');
					        }
					    }

					});
        }

        function updateCurrentSessionThreadId() {

            var sessionThreadID = '';
            var contentFrame = document.getElementById('content');
      
            try {
                var hiddenField = contentFrame.contentDocument.getElementById(sessionThreadIdField);
                if (hiddenField && hiddenField.value) {
                    sessionThreadID = hiddenField.value;
                }

                if (sessionThreadID != window.name) {
                    window.name = sessionThreadID;
                    var identificationUrl = 'Identification.aspx';
                    var proxyFrameUrl = 'ProxyBanner.aspx';

                    if (sessionThreadID) {
                        var threadQueryString = '?' + sessionThreadIdField + '=' + sessionThreadID;
                        identificationUrl += threadQueryString;
                        proxyFrameUrl += threadQueryString;
                    }
                    $('#ident').attr('src', identificationUrl);
                    $('#proxy').attr('src', proxyFrameUrl);

                    
                    var $logoutLink = $(window.frames.menuPage.loginLink); 
                    var logoutHref = $logoutLink.attr("href");
                    if (logoutHref.indexOf("proxyLogout") != -1) {
                        if (logoutHref.indexOf("&proxySessionThreadID=") != -1) 
                        {
                            logoutHref = logoutHref.substring(0, logoutHref.indexOf("&proxySessionThreadID="));
                        }

                        $logoutLink.attr("href", logoutHref + "&proxySessionThreadID=" + sessionThreadID);
                        $logoutLink.click(function (event) {
                            top.name = ''; 
                        });
                    }
                }
            }
            catch (e) {
                

            }
        }

        $(document).ready(function () {
            updateCurrentContentPage();
            $('#content').attr('onload', 'updateCurrentSessionThreadId();');

			
            $('frame').load(function (e) {
        		try {
					
					if (this.id == 'content')	
					{
						if (this.contentWindow.$$disableNavigationControls && this.contentWindow.$$disableNavigationControls())
						{
							
							$('frame:not(#content)').each(function () {	
								disableFrameNavigation(this.contentWindow);	
							});
						}
					}
					else 
					{
						
						if ($('#content')[0].contentWindow.$$disableNavigationControls && $('#content')[0].contentWindow.$$disableNavigationControls())
						{
							
							disableFrameNavigation(this.contentWindow);
						}
					}
        		} catch (e) {  }
			});

            
            $('[name="content"]').load(function (e) {
 
                if (e.target.src.split('/').pop().toLowerCase() === 'mainpage.html') {

                    var anchors = e.target.contentDocument.getElementsByTagName("a");
                    var host = new URL(window.location.href).host;
                  
                    for (var i = 0; i < anchors.length; i++) {
                        var url = new URL(anchors[i].href);

                        if (url.host === host && url.pathname.split('/').pop().toLowerCase() === 'login.asp') {
                            anchors[i].href = 'login.ashx';
                        }
                    }
                }

        		try {
					
					$('body', content.document).css('min-width', '850px');  

                    
                     $($(this).get(0).contentWindow).on('beforeunload', function () {
                         try 
                            {
                                $('textarea, input:text', content.document).each(function () 
                                {
                                    
                                    $(this).val($(this).val().replace(/([\u0000-\u0008]|[\u000B\u000C]|[\u000E-\u001F]|[\uD800-\uDFFF]|[\uFFFE\uFFFF])/gi, ''));
                                });
                            } 
                        catch (e) {}
                     });
                     					
        		} catch (e) {  }
            });
        });

        if (top != self)
            top.location.href = location.href;

        
		function disableFrameNavigation(frame)
		{
			if (frame.$$disableNavigationControls)
			{
				frame.$$disableNavigationControls();
				if(frame.$$enableNavigationControls)
				{
					$($('#content')[0].contentWindow).unload(frame.$$enableNavigationControls);
				}
			}
		}

        function frameBlockUI()
        {
            try
            {
                
                if (menuPage)
                {
                    disableFrameNavigation(menuPage);
                }
                if (ident)
                {
                    disableFrameNavigation(ident);
                }
            }

            catch(e) { }
        }

        function enableFrameNavigation(frame)
		{
			if (frame.$$enableNavigationControls)
			{
				frame.$$enableNavigationControls();
			}
		}

        function frameUnBlockUI()
        {
            try
            {
                
                if (menuPage)
                {
                    enableFrameNavigation(menuPage);
                }
                if (ident)
                {
                    enableFrameNavigation(ident);
                }
            }
            catch(e) {}
        }
       
    </script>
</head>

	<frame name='content' id='content' marginwidth='0'	marginheight='0' frameborder='0' border='0' margin='0' framespacing='0' framepadding='0' />
        
	<frame name='tz' id='tz' scrolling='no' marginwidth='0' marginheight='0' frameborder='0' noresize border='0' margin='0' framespacing='0' framepadding='0' />

    

    <frameset frameborder='0'>
		<frame  name='tc' id='tc' scrolling='no' marginwidth='0' marginheight='0' frameborder='0' noresize border='0' margin='0' framespacing='0' framepadding='0' />
	</frameset>

		<body bgcolor='#ffffff'>
