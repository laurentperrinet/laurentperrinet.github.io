# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: minimal
  theme_night: minimal
  font: minimal
  font_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Scientific website powered by Wowchemy website builder.'
    twitter: 'laurentperrinet'
  analytics:
    google_analytics: 'UA-140381649-1'
    baidu_tongji: ''
  verification:
    google: ''
    baidu: ''


# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: true
    highlight_active_link: true

footer:
  copyright:
    notice: '© {year} <a rel="me" href="https://neuromatch.social/@laurentperrinet">Mastodon</a>. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

date_format: '2006-01-02'
time_format: '13:04'
address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: true
    extra_languages:
      - r
      - python
      - latex
  math:
    enable: true
  diagram:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/laurentperrinet/hugo_academic'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
  # search:
  #   provider: wowchemy
  #   algolia:
  #     app_id: ''
  #     api_key: ''
  #     index_name: ''
  #     show_logo: false

  # https://wowchemy.com/docs/hugo-tutorials/search/#docsearch
  # https://wowchemy.com/docs/hugo-tutorials/search/#algolia  
  search:
    # provider: algolia
    provider: docsearch
    # provider: wowchemy

    wowchemy:
      min_length: 1  # Only the matches whose length exceeds this value will be returned.
      threshold: 0.3  # Where 0 requires a perfect match and 1 matches anything.
    
    algolia:
      app_id: 'LTSUEMOTRB'
      api_key: 'fef85bd52c221d066922d67c54a7968e'
      index_name: 'laurentperrinet'
      show_logo: false

    docsearch:
      app_id: 'LTSUEMOTRB'
      api_key: '1d1fc9a2d13f20418a4a07312b56e748'
      index_name: 'laurentperrinet'
      show_logo: false

  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: master
    local_backend: false
  isotope:
    # Enable if you use the Portfolio widget or Publication filter
    enable: true
  academicons:
    enable: true
